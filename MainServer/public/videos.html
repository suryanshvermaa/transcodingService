           <script>
            let videosData;

                const res=await fetch("http://localhost:8080/getVideos");

                </div>

               fetch('http://localhost:8080/get-signed-url',{

                headers:{

                },
                body:JSON.stringify({url:selectedVideo.videoUrl})
               
               }).then((res)=>{

               }).then((result)=>{

                    const mainV=document.querySelector('.mainV');

                   </video>
                   </div>

                    <button class=" bg-gray-700 text-white rounded-md px-3 py-2 backButton" style="position: absolute;top: 10px;left: 10px;" >Back</button>

                    
                    `;
                    const divb=document.querySelector('.backButton');
                    divb.addEventListener('click',()=>{
                        mainV.innerHTML=''
                    })
                    const player = videojs('my-player');
                    player.play();

                    const buttonRef=document.querySelector('.backButton')
                    const mainV=document.querySelector('.mainV');
                    mainV.innerHTML=``;
                    alert('wait few seconds/minutes video is beeing transcoded');
                    
                }
               })
               
            }
